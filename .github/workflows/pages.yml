# 把介绍页发布到 GitHub Pages。
# 首次使用前：仓库 Settings → Pages → Build and deployment → Source 选择 “GitHub Actions”。
name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v5

      - uses: actions/configure-pages@v5

      # 只发布页面本身，README 与 .github 不进站点
      - name: Assemble site
        run: |
          mkdir _site
          cp -r index.html assets _site/

      - uses: actions/upload-pages-artifact@v4
        with:
          path: _site

      - id: deployment
        uses: actions/deploy-pages@v4
